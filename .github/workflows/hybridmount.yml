name: Build hybridmount.ko

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: rebased-11
        fetch-depth: 0

    - name: Passa al tag v7 dell'upstream
      run: |
        git fetch https://github.com/xfwdrev/android_kernel_samsung_ex2100.git refs/tags/v7:refs/tags/v7
        git checkout v7
        git submodule update --init --recursive
        git log -1 --format=%H

    - name: Update apt
      run: sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install -y \
          build-essential openjdk-8-jdk maven cmake byacc flex automake libtool-bin \
          bison binutils-dev libiberty-dev zip unzip libncurses5-dev curl git ninja-build \
          python3 libssl-dev gcc-aarch64-linux-gnu cpio gawk libarchive-tools lz4 repo

    - name: Scarica toolchain LLVM da kernel.org (letto da build.sh)
      run: |
        CLANG_DIR=$(grep -oE 'toolchain/clang-r[0-9a-z]+' build.sh | head -n1)
        CLANG_MAJOR=$(grep -oE 'bin/clang-[0-9]+' build.sh | head -n1 | grep -oE '[0-9]+$' || true)
        echo "build.sh vuole: dir=$CLANG_DIR major=$CLANG_MAJOR"
        [ -n "$CLANG_DIR" ] || { echo "Impossibile leggere la cartella toolchain da build.sh"; exit 1; }
        MAJ=${CLANG_MAJOR:-[0-9]+}
        BASE=https://mirrors.edge.kernel.org/pub/tools/llvm/files
        FILE=$(curl -sSL "$BASE/" | grep -oE "llvm-${MAJ}\.[0-9.]+-x86_64\.tar\.xz" | sort -uV | tail -n1)
        [ -n "$FILE" ] || { echo "Nessun tarball LLVM $MAJ trovato su kernel.org"; exit 1; }
        echo "Uso $FILE"
        curl -fSL --retry 5 --retry-delay 10 -o /tmp/llvm.tar.xz "$BASE/$FILE"
        mkdir -p "$CLANG_DIR"
        tar -xJf /tmp/llvm.tar.xz -C "$CLANG_DIR" --strip-components=1
        if [ -n "$CLANG_MAJOR" ] && [ ! -e "$CLANG_DIR/bin/clang-$CLANG_MAJOR" ]; then
          ln -s clang "$CLANG_DIR/bin/clang-$CLANG_MAJOR"
        fi
        ls -l "$CLANG_DIR/bin" | grep -E 'clang|ld\.lld'
        "$CLANG_DIR/bin/clang" --version | head -n1
        cat > "$CLANG_DIR/bin/ld" <<EOF
        #!/bin/sh
        exec "$PWD/$CLANG_DIR/bin/ld.lld" "\$@"
        EOF
        chmod +x "$CLANG_DIR/bin/ld"
        head -n2 "$CLANG_DIR/bin/ld"

    - name: Aggiungi sorgenti hybridmount e abilita come modulo
      run: |
        # Cambia TAG con il tag della release di Hybrid Mount installata sul telefono
        # (dalle Releases del repo). "dev" = ultima versione del branch di sviluppo.
        TAG="dev"
        curl -fLSs "https://raw.githubusercontent.com/Hybrid-Mount/meta-hybrid_mount/$TAG/module/vfs/setup.sh" -o /tmp/setup.sh
        sed -i "s#meta-hybrid_mount/dev/#meta-hybrid_mount/$TAG/#" /tmp/setup.sh
        sh /tmp/setup.sh
        grep -n hybridmount fs/Makefile fs/Kconfig
        echo "CONFIG_HYBRIDMOUNT=y" >> arch/arm64/configs/o1s.config

    - name: Run kernel build
      run: |
        chmod +x ./build.sh
        set -o pipefail
        ./build.sh -m o1s 2>&1 | tee build.log

    - name: Mostra errori
      if: failure()
      run: |
        grep -n -B3 -A6 -E "error:|Error:|\*\*\*|No rule|not found|undefined reference|Killed" build.log | grep -v HDRINST | head -120

    - name: Salva log completo
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: Verifica config
      run: |
        grep -H -E 'HYBRIDMOUNT|CONFIG_LOCALVERSION=' out/.config

    - name: Raccogli output kernel
      run: |
        mkdir -p out-kernel
        find . -maxdepth 5 -not -path './.git/*' \
          \( -name 'boot*.img' -o -name '*.zip' -o -name 'Image' -o -name 'Image.gz*' \) \
          -newer build.sh -exec cp -v {} out-kernel/ \;
        ls -lh out-kernel

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel-hybridmount
        path: out-kernel/*
        if-no-files-found: error
