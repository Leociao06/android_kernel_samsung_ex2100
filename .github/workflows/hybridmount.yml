name: Build hybridmount.ko

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: rebased-11
        fetch-depth: 0

    - name: Passa al tag v7 dell'upstream
      run: |
        git fetch https://github.com/xfwdrev/android_kernel_samsung_ex2100.git refs/tags/v7:refs/tags/v7
        git checkout v7
        git submodule update --init --recursive
        git log -1 --format=%H

    - name: Update apt
      run: sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install -y \
          build-essential openjdk-8-jdk maven cmake byacc flex automake libtool-bin \
          bison binutils-dev libiberty-dev zip unzip libncurses5-dev curl git ninja-build \
          python3 libssl-dev gcc-aarch64-linux-gnu cpio gawk libarchive-tools lz4 repo

    - name: Scarica toolchain LLVM da kernel.org
      run: |
        BASE=https://mirrors.edge.kernel.org/pub/tools/llvm/files
        FILE=$(curl -sSL "$BASE/" | grep -o 'llvm-[0-9][0-9.]*-x86_64\.tar\.xz' | sort -uV | tail -n1)
        [ -n "$FILE" ] || { echo "Nessun tarball trovato"; exit 1; }
        echo "Uso $FILE"
        curl -fSL --retry 5 --retry-delay 10 -o /tmp/llvm.tar.xz "$BASE/$FILE"
        mkdir -p toolchain/clang-r596125
        tar -xJf /tmp/llvm.tar.xz -C toolchain/clang-r596125 --strip-components=1
        toolchain/clang-r596125/bin/clang --version | head -n1
        ls toolchain/clang-r596125/bin | grep -E '^ld\.lld$'

    - name: Aggiungi sorgenti hybridmount e abilita come modulo
      run: |
        # Cambia TAG con il tag della release di Hybrid Mount installata sul telefono
        # (dalle Releases del repo). "dev" = ultima versione del branch di sviluppo.
        TAG="dev"
        curl -fLSs "https://raw.githubusercontent.com/Hybrid-Mount/meta-hybrid_mount/$TAG/module/vfs/setup.sh" -o /tmp/setup.sh
        sed -i "s#meta-hybrid_mount/dev/#meta-hybrid_mount/$TAG/#" /tmp/setup.sh
        sh /tmp/setup.sh
        grep -n hybridmount fs/Makefile fs/Kconfig
        shopt -s nullglob
        cfgs=(arch/arm64/configs/*o1s*)
        [ ${#cfgs[@]} -gt 0 ] || { echo "Nessuna defconfig o1s trovata"; exit 1; }
        for f in "${cfgs[@]}"; do
          echo "CONFIG_HYBRIDMOUNT=m" >> "$f"
          echo "Aggiunto a $f"
        done

    - name: Run kernel build
      run: |
        chmod +x ./build.sh
        ./build.sh -m o1s

    - name: Verifica config
      run: |
        find . -name .config -path '*out*' -exec grep -H HYBRIDMOUNT {} \;

    - name: Raccogli il .ko
      run: |
        find . -name 'hybridmount*.ko' -print
        KO=$(find . -name 'hybridmount*.ko' | head -n1)
        [ -n "$KO" ] || { echo "Nessun .ko trovato: build.sh non compila i moduli?"; exit 1; }
        mkdir -p ko && cp "$KO" ko/
        modinfo ko/*.ko | grep -E 'vermagic|depends|description'

    - name: Upload .ko
      uses: actions/upload-artifact@v4
      with:
        name: hybridmount-ko
        path: ko/*.ko
        if-no-files-found: error
